<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Jesús Quintana</title>
  <desc id="desc">A celestial-blue banner with Jesús Quintana's name on the left and a J emblem centered inside orbital rings on the right.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1224"/>
      <stop offset="57%" stop-color="#142340"/>
      <stop offset="100%" stop-color="#201C42"/>
    </linearGradient>
    <radialGradient id="aura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7CD7FF" stop-opacity=".24"/>
      <stop offset="65%" stop-color="#9C9BF9" stop-opacity=".10"/>
      <stop offset="100%" stop-color="#9C9BF9" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="orbital" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8EE6F9"/>
      <stop offset="52%" stop-color="#9CB5F9"/>
      <stop offset="100%" stop-color="#DEB8FC"/>
    </linearGradient>
    <linearGradient id="heading" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F6FCFF"/>
      <stop offset="100%" stop-color="#C9E8FF"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#FFFFFF" stroke-opacity=".055" stroke-width="1"/>
    </pattern>
    <clipPath id="bounds"><rect width="1200" height="320" rx="22"/></clipPath>
    <style>
      .halo { transform-origin: 971px 161px; }
      .star { opacity: .67; }
      @media (prefers-reduced-motion: no-preference) {
        .halo { animation: orbit 40s linear infinite; }
        .star { animation: twinkle 5.5s ease-in-out infinite; }
        .star.delay { animation-delay: -2.4s; }
      }
      @keyframes orbit { to { transform: rotate(360deg); } }
      @keyframes twinkle { 50% { opacity: .22; } }
    </style>
  </defs>
  <g clip-path="url(#bounds)">
    <rect width="1200" height="320" fill="url(#background)"/>
    <rect width="1200" height="320" fill="url(#grid)"/>
    <ellipse cx="982" cy="148" rx="390" ry="260" fill="url(#aura)"/>
    <path d="M0 300C240 232 343 346 554 295S964 253 1200 310" fill="none" stroke="#9CC7FE" stroke-opacity=".12" stroke-width="1.6"/>
    <path d="M0 282C223 229 381 333 597 282S1001 242 1200 278" fill="none" stroke="#B7A5F8" stroke-opacity=".12" stroke-width="1.3"/>
    <g fill="#C8EEFF">
      <circle class="star" cx="805" cy="50" r="2"/>
      <circle class="star delay" cx="1144" cy="72" r="1.7"/>
      <circle class="star" cx="735" cy="251" r="1.4"/>
      <circle class="star delay" cx="1077" cy="275" r="1.2"/>
      <circle class="star" cx="119" cy="279" r="1"/>
    </g>
    <text x="64" y="171" fill="url(#heading)" font-family="Segoe UI, Arial, sans-serif" font-size="72" font-weight="700" letter-spacing="-2">Jesús Quintana</text>
    <text x="68" y="215" fill="#CCDBEF" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="400">Accessible web. Practical tools. Honest evidence.</text>
    <path d="M68 246H520" stroke="#87BEF3" stroke-opacity=".4"/>
    <text x="68" y="276" fill="#9EBBD7" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" letter-spacing="2.1">WEB ACCESSIBILITY  /  FRONT-END  /  TECHNICAL SEO</text>
    <g class="halo" fill="none" stroke="url(#orbital)" stroke-opacity=".58">
      <circle cx="971" cy="161" r="122" stroke-width="1.1" stroke-dasharray="3 9"/>
      <ellipse cx="971" cy="161" rx="95" ry="124" transform="rotate(-34 971 161)" stroke-width="1.2"/>
      <ellipse cx="971" cy="161" rx="124" ry="72" transform="rotate(26 971 161)" stroke-width="1.15"/>
      <circle cx="971" cy="161" r="95" stroke-opacity=".22" stroke-width="1"/>
    </g>
    <circle cx="971" cy="161" r="76" fill="#152C4D" fill-opacity=".8" stroke="#9AD9FF" stroke-opacity=".39"/>
    <circle cx="971" cy="161" r="64" fill="none" stroke="#BDD2FF" stroke-opacity=".11"/>
    <text id="j-monogram" x="971" y="161" dy="-6" dominant-baseline="central" text-anchor="middle" fill="#D9EEFF" font-family="Segoe UI, Arial, sans-serif" font-size="91" font-weight="700">J</text>
    <circle cx="1088" cy="133" r="5" fill="#D5B9FB"/>
    <circle cx="876" cy="88" r="3" fill="#9AE8F7"/>
  </g>
  <rect x=".5" y=".5" width="1199" height="319" rx="21.5" fill="none" stroke="#9AC8F9" stroke-opacity=".2"/>
</svg>
