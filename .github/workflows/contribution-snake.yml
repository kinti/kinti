name: Contribution Snake

on:
  workflow_dispatch:
  schedule:
    - cron: '15 2 * * *'

permissions:
  contents: write

concurrency:
  group: contribution-snake
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate a theme-aware snake from public contributions
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3.5.0
        with:
          github_user_name: kinti
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-light&color_snake=#5370D5&color_dots=#F0F7FD,#C3DDF4,#8CB9E7,#568BD4,#345AB7
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#9FE9FF&color_dots=#101827,#21446A,#32679C,#4999CA,#9FE9FF

      - name: Verify both generated animations exist
        run: |
          test -s dist/github-contribution-grid-snake.svg
          test -s dist/github-contribution-grid-snake-dark.svg

      - name: Publish generated snake files to output branch
        uses: crazy-max/ghaction-github-pages@df5cc2bfa78282ded844b354faee141f06b41865 # v4.2.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
